server {
    listen 80;
    listen [::]:80;
    server_name gamebeat.ir www.gamebeat.ir;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 301 https://gamebeat.ir$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gamebeat.ir www.gamebeat.ir;
    ssl_certificate /etc/letsencrypt/live/gamebeat.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamebeat.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 30m;
    access_log /var/log/nginx/gamebeat.access.log;
    error_log /var/log/nginx/gamebeat.error.log warn;
    location /static/ {
        alias /srv/apps/gamebeat/staticfiles/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ {
        alias /srv/apps/gamebeat/media/;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /healthz/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:18002;
    }
    location / {
        proxy_pass http://127.0.0.1:18002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 95s;
    }
}
